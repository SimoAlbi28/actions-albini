name: Multi-Step Condizionale
on:
  push:
  workflow_dispatch:

jobs:
  test-condizioni:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Step 1 - Esecuzione normale
        id: step1
        run: |
          echo "✅ Step 1: Esecuzione riuscita"
          echo "Branch corrente: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"

      - name: ⚠️ Step 2 - Simula fallimento
        id: step2
        continue-on-error: true
        run: |
          echo "⚠️ Step 2: Questo step fallirà intenzionalmente"
          exit 1

      - name: ✅ Step 3 - Esegue solo se Step 2 ha successo
        if: success()
        run: |
          echo "✅ Step 3: Questo NON dovrebbe essere eseguito (Step 2 è fallito)"

      - name: 🚨 Step 4 - Esegue solo se c'è stato un fallimento
        if: failure() || steps.step2.outcome == 'failure'
        run: |
          echo "🚨 Step 4: Rilevato fallimento nello Step 2"
          echo "Outcome Step 2: ${{ steps.step2.outcome }}"

      - name: 🔄 Step 5 - Esegue sempre
        if: always()
        run: |
          echo "🔄 Step 5: Questo step viene SEMPRE eseguito"
          echo "Status job: ${{ job.status }}"

      - name: 🌿 Step 6 - Solo su branch main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🌿 Step 6: Eseguito SOLO su branch main"
          echo "Questo è il branch di produzione!"

      - name: 🔀 Step 7 - Solo su branch develop
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "🔀 Step 7: Eseguito SOLO su branch develop"
          echo "Questo è il branch di sviluppo!"

      - name: 🚀 Step 8 - Solo su branch feature
        if: contains(github.ref, 'feature/')
        run: |
          echo "🚀 Step 8: Eseguito SOLO su branch feature/*"
          echo "Branch feature rilevato: ${{ github.ref }}"

      - name: 🔍 Step 9 - Solo per Pull Request
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Step 9: Eseguito SOLO per Pull Request"
          echo "PR Number: ${{ github.event.pull_request.number }}"

      - name: 👆 Step 10 - Solo per esecuzione manuale
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "👆 Step 10: Eseguito SOLO tramite workflow_dispatch (manuale)"
          echo "Attivato da: ${{ github.actor }}"

      - name: 📊 Step 11 - Riepilogo finale
        if: always()
        run: |
          echo "📊 === RIEPILOGO ESECUZIONE ==="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "SHA: ${{ github.sha }}"
          echo "Job status: ${{ job.status }}"
          echo "==========================="
