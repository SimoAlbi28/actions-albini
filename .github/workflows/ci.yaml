name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci

      - name: 🔍 Run lint
        run: |
          echo "Running lint..."
          npm run lint

      - name: 🧪 Run tests
        run: |
          echo "Running tests..."
          npm test
